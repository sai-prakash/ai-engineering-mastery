name: Deploy course to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "progress/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live Pages response
        shell: bash
        run: |
          set -euo pipefail
          page_url="${{ steps.deployment.outputs.page_url }}"
          test -n "$page_url"
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 "$page_url" -o /tmp/pages-index.html
          grep -Fq '<title>AI Engineering Mastery — Prove You Can Engineer It</title>' /tmp/pages-index.html
